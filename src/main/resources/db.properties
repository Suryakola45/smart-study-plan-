# Database credentials are required as DB_URL, DB_USER, and DB_PASSWORD environment variables.
# Do not put passwords in this file or commit them to source control.
db.driver=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=300000
db.pool.connectionTimeout=20000
db.pool.maxLifetime=1200000
